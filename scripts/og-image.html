<!--
  og-image.html — source for /og.png, the 1200x630 social preview card.

  Regenerate after a wording or branding change:

    chrome --headless --disable-gpu --hide-scrollbars            --force-device-scale-factor=1 --window-size=1200,630            --screenshot=og.png scripts/og-image.html

  Keep it at 1200x630: that is the size Open Graph consumers crop to.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{background:#0e1117;color:#e8edf5;font-family:"Segoe UI",system-ui,sans-serif;
 display:flex;flex-direction:column;justify-content:center;padding:0 84px;
 background-image:radial-gradient(900px 480px at 88% -12%, rgba(56,152,255,.20), transparent 62%);}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:30px}
.mark{font-size:62px;color:#4da3ff;line-height:1}
.name{font-size:62px;font-weight:700;letter-spacing:-1.4px}
h1{font-size:47px;font-weight:600;line-height:1.24;letter-spacing:-.9px;max-width:1000px;color:#f4f8ff}
p.sub{margin-top:26px;font-size:27px;color:#9fb0c6;line-height:1.5;max-width:1000px}
.chips{margin-top:42px;display:flex;flex-wrap:wrap;gap:12px}
.chip{font-size:22px;padding:9px 19px;border:1px solid #2b3648;border-radius:999px;color:#c3d0e2;background:#151b26}
.foot{position:absolute;bottom:44px;left:84px;font-size:24px;color:#6f8099}
</style></head><body>
<div class="brand"><span class="mark">⇄</span><span class="name">FormatPort</span></div>
<h1>Developer converters that run entirely in your browser</h1>
<p class="sub">JSON · YAML · TOML · CSV · XML · JWT · Base64 · cURL · hashes · timestamps · regex</p>
<div class="chips"><span class="chip">25 tools</span><span class="chip">No upload</span><span class="chip">No signup</span><span class="chip">No tracking</span></div>
<div class="foot">formatport.com</div>
</body></html>
